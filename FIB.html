<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIB 动态仿真系统</title>
    <style>
        * {
            margin: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #111;
            font-family: 'Segoe UI', sans-serif;
            color: #fff;
        }

        #canvas {
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
        }

        #panel {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 300px;
            background: rgba(20, 25, 30, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
            z-index: 10;
        }

        h1 {
            font-size: 16px;
            color: #4db8ff;
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        h2 {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            margin: 12px 0 8px;
        }

        .row {
            margin-bottom: 10px;
        }

        .row label {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 4px;
        }

        .val {
            color: #4db8ff;
            font-weight: bold;
            font-family: monospace;
        }

        input[type=range] {
            width: 100%;
            -webkit-appearance: none;
            background: #333;
            height: 4px;
            border-radius: 2px;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            background: #4db8ff;
            border-radius: 50%;
            cursor: pointer;
        }

        input[type=range]::-moz-range-thumb {
            width: 12px;
            height: 12px;
            background: #4db8ff;
            border-radius: 50%;
            border: none;
            cursor: pointer;
        }

        select {
            width: 100%;
            background: #333;
            color: #fff;
            border: none;
            padding: 6px;
            border-radius: 4px;
        }

        button {
            width: 100%;
            padding: 8px;
            background: #d32f2f;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 15px;
        }

        button:hover {
            background: #b71c1c;
        }

        .status {
            display: flex;
            align-items: center;
            font-size: 12px;
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid #333;
        }

        .led {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ffaa00;
            margin-right: 8px;
            transition: all 0.2s;
        }

        .led.on {
            background: #ff0000;
            box-shadow: 0 0 8px #ff0000;
        }

        .hint {
            font-size: 10px;
            color: #666;
            margin-top: 8px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>

<body>
    <div id="panel">
        <h1>FIB 物理仿真控制台</h1>
        <h2>束流参数</h2>
        <div class="row">
            <label>加速电压 (kV) <span class="val" id="vVolt">30</span></label>
            <input type="range" id="iVolt" min="5" max="30" step="5" value="30">
        </div>
        <div class="row">
            <label>束流电流 (nA) <span class="val" id="vCurr">5.0</span></label>
            <input type="range" id="iCurr" min="0.1" max="20" step="0.1" value="5">
        </div>
        <h2>材料</h2>
        <div class="row">
            <select id="iMat">
                <option value="1.0">Silicon (Si)</option>
                <option value="2.5">Gold (Au)</option>
                <option value="0.2">Diamond (C)</option>
            </select>
        </div>
        <button id="btnReset">重置样品</button>
        <div class="status">
            <div class="led" id="led"></div>
            <span id="stat">READY</span>
        </div>
        <div class="hint">左键加工 | 右键旋转 | 滚轮缩放</div>
    </div>
    <div id="canvas"></div>

    <!-- 仿真着色器 (Yamamura Model) -->
    <script id="simFrag" type="x-shader/x-fragment">
        uniform sampler2D tH;
        uniform vec2 uPos;
        uniform float uR, uI, uY;
        uniform int uOn;
        varying vec2 vUv;
        
        const float TEX = 1.0/512.0, F = 1.8, S = 2.5, TM = 1.3;
        
        float gauss(vec2 p, vec2 c, float s) {
            vec2 d = p - c;
            return exp(-dot(d,d) / (2.0*s*s));
        }
        
        vec3 getNormal() {
            float hL = texture2D(tH, vUv - vec2(TEX,0)).r;
            float hR = texture2D(tH, vUv + vec2(TEX,0)).r;
            float hD = texture2D(tH, vUv - vec2(0,TEX)).r;
            float hU = texture2D(tH, vUv + vec2(0,TEX)).r;
            return normalize(vec3(-(hR-hL)*0.05, 1.0, -(hU-hD)*0.05));
        }
        
        float yamamura(float ct) {
            ct = max(ct, 0.1);
            float t = acos(ct);
            if(t > TM) return exp(-(t-TM)*5.0);
            return pow(ct, -F) * exp(-S*(1.0/ct - 1.0));
        }
        
        void main() {
            float h = texture2D(tH, vUv).r;
            
            if(uOn == 1) {
                float beam = gauss(vUv, uPos, uR);
                vec3 n = getNormal();
                float ct = max(n.y, 0.0);
                float y = yamamura(ct);
                float rem = beam * uI * uY * y * min(1.0/max(ct,0.3), 3.0);
                if(rem > 1e-5) h -= rem;
                
                // 再沉积
                float d = length(vUv - uPos);
                if(d > uR*2.0 && d < uR*4.0) 
                    h += beam * uI * 0.05 * exp(-(d - uR*2.0)*10.0);
            }
            
            // 表面扩散
            float hL = texture2D(tH, vUv - vec2(TEX,0)).r;
            float hR = texture2D(tH, vUv + vec2(TEX,0)).r;
            float hD = texture2D(tH, vUv - vec2(0,TEX)).r;
            float hU = texture2D(tH, vUv + vec2(0,TEX)).r;
            h += ((hL+hR+hD+hU)/4.0 - h) * 0.001;
            
            gl_FragColor = vec4(clamp(h, -5.0, 0.5), 0, 0, 1);
        }
    </script>

    <script id="simVert" type="x-shader/x-vertex">
        varying vec2 vUv;
        void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
    </script>

    <!-- 渲染着色器 -->
    <script id="renVert" type="x-shader/x-vertex">
        uniform sampler2D tH;
        varying vec2 vUv;
        varying float vH;
        void main() {
            vUv = uv;
            float h = texture2D(tH, uv).r;
            vH = h;
            vec3 p = position;
            p.y += h * 2.0;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
        }
    </script>

    <script id="renFrag" type="x-shader/x-fragment">
        uniform sampler2D tH;
        varying vec2 vUv;
        varying float vH;
        
        void main() {
            float TEX = 1.0/512.0;
            float h = texture2D(tH, vUv).r * 2.0;
            float hx = texture2D(tH, vUv + vec2(TEX,0)).r * 2.0;
            float hy = texture2D(tH, vUv + vec2(0,TEX)).r * 2.0;
            vec3 n = normalize(cross(vec3(0, hy-h, TEX), vec3(TEX, hx-h, 0)));
            
            vec3 L = normalize(vec3(1, 2, 1));
            float diff = max(dot(n, L), 0.0);
            float spec = pow(max(dot(reflect(-L, n), vec3(0,0,1)), 0.0), 32.0);
            float edge = pow(1.0 - abs(n.y), 2.0);
            
            vec3 base = mix(vec3(0.2, 0.22, 0.25), vec3(0.1, 0.05, 0.05), clamp(abs(vH), 0.0, 1.0));
            vec3 col = base * (0.2 + diff) + vec3(0.4) * spec + vec3(0.4) * edge;
            gl_FragColor = vec4(col, 1.0);
        }
    </script>

    <script>
        (function () {
            // 配置
            const SIM = 512, PARTICLES = 1500;

            // DOM
            const $ = id => document.getElementById(id);
            const container = $('canvas'), led = $('led'), stat = $('stat');
            const iVolt = $('iVolt'), iCurr = $('iCurr'), iMat = $('iMat');
            const vVolt = $('vVolt'), vCurr = $('vCurr');

            // Three.js 初始化
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050505);
            scene.fog = new THREE.FogExp2(0x050505, 0.02);

            const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
            camera.position.set(0, 8, 8);

            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(innerWidth, innerHeight);
            renderer.setPixelRatio(devicePixelRatio);
            container.appendChild(renderer.domElement);

            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.mouseButtons = { LEFT: null, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.ROTATE };

            // GPGPU
            const rtOpts = { format: THREE.RGBAFormat, type: THREE.FloatType, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter };
            let rtA = new THREE.WebGLRenderTarget(SIM, SIM, rtOpts);
            let rtB = new THREE.WebGLRenderTarget(SIM, SIM, rtOpts);

            const simScene = new THREE.Scene();
            const simCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
            const simUni = {
                tH: { value: null },
                uPos: { value: new THREE.Vector2(0.5, 0.5) },
                uR: { value: 0.02 },
                uI: { value: 0.01 },
                uY: { value: 1.0 },
                uOn: { value: 0 }
            };
            const simMat = new THREE.ShaderMaterial({
                uniforms: simUni,
                vertexShader: $('simVert').textContent,
                fragmentShader: $('simFrag').textContent
            });
            simScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), simMat));

            // 地形
            const terrainGeo = new THREE.PlaneGeometry(10, 10, 256, 256);
            terrainGeo.rotateX(-Math.PI / 2);
            const terrainUni = { tH: { value: null } };
            const terrainMat = new THREE.ShaderMaterial({
                uniforms: terrainUni,
                vertexShader: $('renVert').textContent,
                fragmentShader: $('renFrag').textContent
            });
            scene.add(new THREE.Mesh(terrainGeo, terrainMat));
            scene.add(new THREE.GridHelper(20, 40, 0x444444, 0x222222));

            // 光束
            const beamGeo = new THREE.CylinderGeometry(0.02, 0.05, 10, 12);
            beamGeo.translate(0, 5, 0);
            const beamMat = new THREE.MeshBasicMaterial({ color: 0x4db8ff, transparent: true, opacity: 0, blending: THREE.AdditiveBlending });
            const beam = new THREE.Mesh(beamGeo, beamMat);
            scene.add(beam);

            // 粒子 (简化)
            const pPos = new Float32Array(PARTICLES * 3);
            const pVel = new Float32Array(PARTICLES * 3);
            const pLife = new Float32Array(PARTICLES);
            for (let i = 0; i < PARTICLES; i++) { pPos[i * 3 + 1] = -100; pLife[i] = 0; }
            const pGeo = new THREE.BufferGeometry();
            pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
            const pMat = new THREE.PointsMaterial({ color: 0xffaa00, size: 0.05, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending });
            scene.add(new THREE.Points(pGeo, pMat));

            // 交互
            const ray = new THREE.Raycaster();
            const mouse = new THREE.Vector2();
            const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
            const hit = new THREE.Vector3();
            let isDown = false, worldHit = new THREE.Vector3();

            renderer.domElement.addEventListener('pointerdown', e => {
                if (e.button === 0) { isDown = true; setBeam(true); }
            }, { capture: true });

            addEventListener('pointerup', e => {
                if (e.button === 0) { isDown = false; setBeam(false); }
            });

            addEventListener('pointermove', e => {
                mouse.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
                ray.setFromCamera(mouse, camera);
                if (ray.ray.intersectPlane(plane, hit)) {
                    worldHit.copy(hit);
                    const uvX = (hit.x + 5) / 10, uvY = (hit.z + 5) / 10;
                    if (uvX >= 0 && uvX <= 1 && uvY >= 0 && uvY <= 1) {
                        simUni.uPos.value.set(uvX, 1 - uvY);
                        beam.position.set(hit.x, 0, hit.z);
                    }
                }
            });

            // UI
            function updateParams() {
                const v = +iVolt.value, c = +iCurr.value;
                vVolt.textContent = v;
                vCurr.textContent = c.toFixed(1);
                simUni.uR.value = 0.05 - (v / 30) * 0.04;
                simUni.uI.value = c * 0.002;
                simUni.uY.value = +iMat.value;
                if (c > 10) simUni.uR.value *= 1.2;
                beam.scale.setScalar(simUni.uR.value * 50);
            }

            function setBeam(on) {
                simUni.uOn.value = on ? 1 : 0;
                beamMat.opacity = on ? 0.6 : 0;
                led.classList.toggle('on', on);
                stat.textContent = on ? 'EMITTING' : 'READY';
                stat.style.color = on ? '#f44' : '#aaa';
            }

            iVolt.oninput = iCurr.oninput = iMat.onchange = updateParams;
            $('btnReset').onclick = () => { renderer.setRenderTarget(rtA); renderer.clear(); renderer.setRenderTarget(rtB); renderer.clear(); renderer.setRenderTarget(null); };
            updateParams();

            // 粒子更新
            function updateParticles() {
                if (!isDown) return;
                const pos = pGeo.attributes.position.array;
                for (let i = 0, emit = 8; i < PARTICLES && emit > 0; i++) {
                    if (pLife[i] <= 0) {
                        pLife[i] = 1;
                        pos[i * 3] = worldHit.x + (Math.random() - 0.5) * 0.1;
                        pos[i * 3 + 1] = 0;
                        pos[i * 3 + 2] = worldHit.z + (Math.random() - 0.5) * 0.1;
                        pVel[i * 3] = (Math.random() - 0.5) * 0.3;
                        pVel[i * 3 + 1] = Math.random() * 0.5 + 0.2;
                        pVel[i * 3 + 2] = (Math.random() - 0.5) * 0.3;
                        emit--;
                    }
                }
                for (let i = 0; i < PARTICLES; i++) {
                    if (pLife[i] > 0) {
                        pos[i * 3] += pVel[i * 3];
                        pos[i * 3 + 1] += pVel[i * 3 + 1];
                        pos[i * 3 + 2] += pVel[i * 3 + 2];
                        pVel[i * 3 + 1] -= 0.01;
                        pLife[i] -= 0.02;
                    } else {
                        pos[i * 3 + 1] = -100;
                    }
                }
                pGeo.attributes.position.needsUpdate = true;
            }

            // 主循环
            function animate() {
                requestAnimationFrame(animate);
                controls.update();

                // GPGPU
                simUni.tH.value = rtA.texture;
                renderer.setRenderTarget(rtB);
                renderer.render(simScene, simCam);
                [rtA, rtB] = [rtB, rtA];

                updateParticles();

                renderer.setRenderTarget(null);
                terrainUni.tH.value = rtA.texture;
                renderer.render(scene, camera);
            }

            addEventListener('resize', () => {
                camera.aspect = innerWidth / innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(innerWidth, innerHeight);
            });

            animate();
        })();
    </script>
</body>

</html>
